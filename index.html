<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人简历</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      padding: 12px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    a.download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: #0969da;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    a.download:hover { background: #0860ca; }
    .viewer {
      flex: 1;
      padding: 16px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      background: #fff;
    }
    .fallback {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #555;
    }
    @media (max-width: 600px) {
      .viewer { padding: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>个人简历</h1>
    <a class="download" href="resume.pdf" download>
      ↓ 下载 PDF
    </a>
  </header>
  <div class="viewer">
    <iframe
      src="resume.pdf"
      title="个人简历"
      onerror="document.querySelector('.viewer').style.display='none';document.querySelector('.fallback').style.display='flex';"
    ></iframe>
  </div>
  <div class="fallback">
    <p>PDF 预览不可用，请直接下载查看。</p>
    <a class="download" href="resume.pdf" download>↓ 下载 PDF</a>
  </div>
</body>
</html>
